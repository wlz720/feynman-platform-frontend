# 课时16：前端 Nginx 配置
# 职责：托管 dist 静态文件、把 /api 转发给 backend 容器、支持 React Router 的 history 路由。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 压缩文本类资源
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # API 反向代理：/api/users -> http://backend:3000/api/users
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大模型出题/阅卷可能耗时较久，读超时给到 120s
        proxy_read_timeout 120s;
        # 音频上传为 2MB 上限，留出 multipart 余量
        client_max_body_size 4m;
    }

    # Service Worker 与 manifest 必须实时校验，不能长缓存
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # 带哈希的构建产物可长期缓存
    location ~* \.(js|css|woff2|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # SPA 回退：/agent、/graph 等前端路由都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
